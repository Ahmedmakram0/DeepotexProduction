<!DOCTYPE html>
<html>
<head>
    <title>Product Placeholder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            width: 400px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .placeholder {
            text-align: center;
            padding: 20px;
        }
        .placeholder-icon {
            font-size: 60px;
            color: #999;
            margin-bottom: 20px;
        }
        .placeholder-text {
            font-size: 24px;
            color: #666;
            font-weight: bold;
        }
        .placeholder-subtext {
            font-size: 16px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="placeholder-icon">📷</div>
        <div class="placeholder-text">Product Image</div>
        <div class="placeholder-subtext">No image available</div>
    </div>
</body>
</html>
